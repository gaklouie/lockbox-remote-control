[project]
name = "lockbox-web"
version = "0.1.0"
description = "Prototype web service for the lockbox: one program owns the DAC/ADC, many browsers control it"
requires-python = ">=3.9"
dependencies = [
    # Same hardware / logging stack as lockbox_gui (its autolock_app package is imported from there)
    "adafruit-blinka",
    "adafruit-circuitpython-mcp4728",
    "adafruit-circuitpython-ads1x15",
    "paho-mqtt",
    "python-dotenv",
    "numpy",
    "matplotlib",
    "RPi.GPIO",
    # Web service
    "fastapi",
    "uvicorn[standard]",
]
